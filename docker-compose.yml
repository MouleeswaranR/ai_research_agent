version: '3.8'

services:
  # ── Redis (Broker & Cache) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: auto_dev_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (Local Database Option) ─────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: auto_dev_postgres
    environment:
      POSTGRES_USER: auto_dev
      POSTGRES_PASSWORD: auto_dev_password
      POSTGRES_DB: auto_dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_dev -d auto_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Web Server & Dashboard ──────────────────────────
  web:
    build: .
    container_name: auto_dev_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    build: .
    container_name: auto_dev_celery
    command: celery -A app.celery_app worker --loglevel=info -Q default,agents,pipeline,review
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
