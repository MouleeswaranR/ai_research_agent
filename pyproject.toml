[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-dev-company"
version = "0.2.0"
description = "Autonomous multi-agent software development pipeline with NVIDIA NIM"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    # Database (Neon DB)
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Redis & Celery
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    # HTTP client (for NVIDIA NIM + Groq API)
    "httpx>=0.27.0",
    # LangChain
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    # Logging
    "structlog>=24.0.0",
    # Settings
    "pydantic-settings>=2.3.0",
    # Code quality tools (used inside sandbox + locally)
    "ruff>=0.5.0",
    "bandit>=1.7.0",
    "radon>=6.0.0",
    "safety>=3.0.0",
    # Docker SDK
    "docker>=7.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
